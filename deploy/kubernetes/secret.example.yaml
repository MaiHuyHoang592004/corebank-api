# Copy to secret.yaml, replace every value, and keep that copy out of git.
# secret.yaml is listed in .gitignore for exactly this reason.
#
#   cp secret.example.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
#
# stringData is used rather than data so the values are readable here. Kubernetes
# base64-encodes them on write; that is encoding, not encryption, so a real
# deployment should source these from a secret manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: corebank-secrets
  namespace: corebank
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: corebank
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME_database_password
  POSTGRES_PASSWORD: CHANGE_ME_database_password
  # Unlocks the maintenance and execution endpoints when the showcase gate is on.
  COREBANK_SHOWCASE_TOKEN: CHANGE_ME_showcase_token
