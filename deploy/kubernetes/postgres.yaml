# PostgreSQL for the lab cluster.
#
# This is deliberately a single instance with one volume: the point of this
# deployment is to exercise the application's rollout, probe and scaling behaviour,
# not to demonstrate database high availability. A real deployment would use a
# managed service or an operator that handles failover, backups and point-in-time
# recovery. Treat this as the dependency under test, not as a reference.
apiVersion: v1
kind: Service
metadata:
  name: corebank-postgres
  namespace: corebank
  labels:
    app.kubernetes.io/name: corebank-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: corebank-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: corebank-postgres
  namespace: corebank
  labels:
    app.kubernetes.io/name: corebank-postgres
spec:
  serviceName: corebank-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corebank-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corebank-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: corebank
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: corebank-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corebank-secrets
                  key: POSTGRES_PASSWORD
            # The image refuses to initialise into a non-empty mount root, and the
            # default PGDATA is the mount root itself.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d corebank"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d corebank"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
