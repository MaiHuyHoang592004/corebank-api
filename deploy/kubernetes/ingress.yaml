# LEGACY AND UNVERIFIED. This Ingress targets ingress-nginx (ingressClassName: nginx), which
# Kubernetes retired in March 2026: the repository is archived and receives no releases or
# security fixes. The runtime verification installed no ingress controller, so nothing has
# served traffic through this object; the API server accepted it and that is all that was
# observed. It is kept as it was. On Kind the verified access path is a Service port-forward
# (see README.md), and on OpenShift external routing is the Route in deploy/openshift.
# Replacing it (another controller, or the Gateway API) is a separate infrastructure change.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corebank-api
  namespace: corebank
  labels:
    app.kubernetes.io/name: corebank-api
  annotations:
    # The dashboard posts money commands that wait on row locks; the default 60s
    # upstream timeout is fine, but be explicit rather than inheriting it silently.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # Add to /etc/hosts for a local cluster:  127.0.0.1  corebank.local
    - host: corebank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corebank-api
                port:
                  name: http
