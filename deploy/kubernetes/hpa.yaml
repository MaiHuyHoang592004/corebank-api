# Requires metrics-server. kind does not ship one:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl -n kube-system patch deployment metrics-server --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# Without it the HPA reports "unknown" for the metric and does nothing. It does not
# break the Deployment; it just never scales.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: corebank-api
  namespace: corebank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: corebank-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A JVM that has just warmed up is expensive to throw away, and money commands
      # are bursty. Scale down slowly.
      stabilizationWindowSeconds: 300
