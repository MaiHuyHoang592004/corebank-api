# Local cluster for the lab. Three workers so that the pod anti-affinity rule in
# deployment.yaml actually spreads the replicas and a node drain is a meaningful
# exercise rather than a no-op.
#
#   kind create cluster --name corebank --config kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: corebank
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Marks the node that has ports 80 and 443 mapped to the host, for an ingress
      # controller that selects it. The runtime verification installed no ingress controller
      # (ingress-nginx is retired) and reached the application through a Service
      # port-forward, so this label and the port mappings below were not exercised.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
