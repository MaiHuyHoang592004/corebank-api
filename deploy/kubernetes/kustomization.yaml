apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: corebank

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# secret.yaml is intentionally absent: it is generated from secret.example.yaml and
# is not committed. Apply it separately before the first rollout.

commonLabels:
  app.kubernetes.io/part-of: corebank
