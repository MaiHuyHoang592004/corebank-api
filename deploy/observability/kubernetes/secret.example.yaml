# Copy to secret.yaml, replace the value, and keep that copy out of git.
# secret.yaml is listed in .gitignore for exactly this reason.
#
#   cp secret.example.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
#
# stringData is used rather than data so the value is readable here. Kubernetes
# base64-encodes it on write; that is encoding, not encryption, so a real deployment
# should source this from a secret manager instead.
#
# This Secret is not part of kustomization.yaml and is applied separately, the same
# way deploy/kubernetes/secret.example.yaml is. A token in a kustomize build is a
# token in `kubectl kustomize` output, in CI logs, and in anything that renders the
# overlay to a file.
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-secrets
  namespace: corebank
type: Opaque
stringData:
  # A Dynatrace API token with the OTLP ingest scopes — at minimum
  # openTelemetryTrace.ingest, metrics.ingest and logs.ingest, depending on which
  # pipelines are left enabled in otel-collector-config.yaml. The exact scope names
  # come from the Dynatrace tenant's token page and have not been checked against a
  # live tenant here.
  #
  # Ingest-only. Do not reuse an API token that also carries read or configuration
  # scopes: this one sits in a pod's environment, where anything that can exec into
  # the pod can read it.
  DYNATRACE_API_TOKEN: CHANGE_ME_dynatrace_ingest_token
