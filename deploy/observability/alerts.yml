# Alerts on the numbers that mean this system is failing as a bank.
#
# Deliberately short. An alert nobody acts on trains people to ignore the ones that
# matter, so each rule here names a condition with a known response, and the runbook
# annotation says what that response is.
groups:
  - name: corebank-money
    rules:
      - alert: OutboxBacklogGrowing
        expr: corebank_outbox_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog is {{ $value }} events and not draining"
          description: >-
            Events are being written inside money transactions but not published, so
            every downstream consumer is drifting out of date while the API still
            returns 200. The usual cause is the publisher not running or the broker
            being unreachable.

            Known caveat: any deployment with COREBANK_KAFKA_ENABLED=false has no
            publisher bean at all, so the backlog grows without bound and this rule
            fires permanently. That is a deliberate configuration, not an incident, and
            an alert that always fires is worse than no alert — so either enable
            publication or silence this rule for that environment.
          runbook: >-
            docs/31-operations-runbook.md#outboxbackloggrowing — FIRST check whether
            publication is switched off for this deployment. OutboxEventPublisher is
            @ConditionalOnProperty(corebank.kafka.enabled), and the Kubernetes ConfigMap
            sets COREBANK_KAFKA_ENABLED=false, so the bean does not exist and this alert
            is expected rather than actionable there. If publication is meant to be on,
            check the publisher thread, then broker connectivity. GET
            /api/reporting/outbox/summary shows the breakdown by status.

      - alert: OutboxDeadLetters
        expr: corebank_outbox_dead_letters > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} outbox events exhausted their retries"
          description: >-
            These events will never be published without intervention. Each one is a
            downstream system that has permanently missed a money event.
          runbook: >-
            docs/31-operations-runbook.md#outboxdeadletters — GET
            /api/reporting/outbox/dead-letters to inspect, fix the cause, then requeue.
            Requeue is behind maker/checker approval.

      - alert: ReconciliationBreaksOpen
        expr: corebank_reconciliation_open_breaks > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} unresolved reconciliation breaks"
          description: >-
            The ledger and an external statement disagree. Until this is resolved the
            books cannot be certified.
          runbook: >-
            docs/31-operations-runbook.md#reconciliationbreaksopen — GET
            /api/reporting/reconciliation/breaks for the break taxonomy.
            (/api/ops/reconciliation only exposes POST /runs and POST /external/runs;
            this annotation named a path that does not exist until 2026-09-20.)

      # Watches stale, not in_flight, and the difference is the whole point.
      #
      # This rule used to fire on `corebank_idempotency_in_flight > 10`. That is a
      # traffic measure: ten money commands in flight at once is a busy instance, not a
      # fault, so the rule paged on load and stayed silent on the fault it was written
      # for. A claim older than the takeover lease is unambiguous — its owner is gone.
      # Any non-zero value is worth a human, so the threshold is 0 rather than a number
      # chosen to suppress noise that was never signal.
      - alert: IdempotencyKeysStranded
        expr: corebank_idempotency_stale > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} money commands stranded past the takeover lease"
          description: >-
            A command claims its idempotency key before executing and resolves it
            afterwards. A claim older than the lease belongs to an instance that stopped
            between those two points: the money was rolled back, but the customer's
            operation did not happen and nobody has retried it.
          runbook: >-
            docs/31-operations-runbook.md#idempotencykeysstranded — cross-check against
            ledger_journals to establish what actually committed before clearing keys.

  - name: corebank-platform
    rules:
      - alert: MoneyEndpointErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{uri=~"/api/(payments|transfers|deposits|lending).*",status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{uri=~"/api/(payments|transfers|deposits|lending).*"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of money requests are failing"
          description: >-
            Scoped to money endpoints on purpose: an error rate averaged over every
            route lets a broken transfer path hide behind healthy dashboard traffic.
          runbook: >-
            docs/31-operations-runbook.md#moneyendpointerrorrate — separate "failing" from
            "refusing": a duplicate-claim rejection is a 4xx and is correct behaviour.

      - alert: MoneyEndpointLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/(payments|transfers).*"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 on money endpoints is above 2 seconds"
          description: >-
            These paths take row locks. Latency here usually means lock contention or a
            slow database, and it turns into queued requests rather than errors, so it
            will not show up as a failure rate.
          runbook: >-
            docs/31-operations-runbook.md#moneyendpointlatency — check
            hikaricp_connections_pending first. A money command holds two connections,
            so pool exhaustion presents as latency long before it presents as errors.
