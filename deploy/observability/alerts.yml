# Alerts on the numbers that mean this system is failing as a bank.
#
# Deliberately short. An alert nobody acts on trains people to ignore the ones that
# matter, so each rule here names a condition with a known response, and the runbook
# annotation says what that response is.
groups:
  - name: corebank-money
    rules:
      - alert: OutboxBacklogGrowing
        expr: corebank_outbox_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog is {{ $value }} events and not draining"
          description: >-
            Events are being written inside money transactions but not published, so
            every downstream consumer is drifting out of date while the API still
            returns 200. The usual cause is the publisher not running or the broker
            being unreachable.
          runbook: >-
            Check that the application has @EnableScheduling and that the publisher
            thread is alive, then check broker connectivity. GET
            /api/reporting/outbox/summary shows the breakdown by status.

      - alert: OutboxDeadLetters
        expr: corebank_outbox_dead_letters > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} outbox events exhausted their retries"
          description: >-
            These events will never be published without intervention. Each one is a
            downstream system that has permanently missed a money event.
          runbook: >-
            GET /api/reporting/outbox/dead-letters to inspect, fix the cause, then
            requeue. Requeue is behind maker/checker approval.

      - alert: ReconciliationBreaksOpen
        expr: corebank_reconciliation_open_breaks > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} unresolved reconciliation breaks"
          description: >-
            The ledger and an external statement disagree. Until this is resolved the
            books cannot be certified.
          runbook: "GET /api/ops/reconciliation/breaks for the break taxonomy."

      - alert: IdempotencyKeysStranded
        expr: corebank_idempotency_in_flight > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} money commands stuck IN_PROGRESS"
          description: >-
            A command claims its idempotency key before executing and resolves it
            afterwards. A count that stays high means commands were interrupted
            between those two points, so their outcome is unknown and a retry with the
            same key will be refused.
          runbook: >-
            Cross-check against ledger_journals to establish what actually committed
            before clearing the keys.

  - name: corebank-platform
    rules:
      - alert: MoneyEndpointErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{uri=~"/api/(payments|transfers|deposits|lending).*",status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{uri=~"/api/(payments|transfers|deposits|lending).*"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of money requests are failing"
          description: >-
            Scoped to money endpoints on purpose: an error rate averaged over every
            route lets a broken transfer path hide behind healthy dashboard traffic.

      - alert: MoneyEndpointLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/(payments|transfers).*"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 on money endpoints is above 2 seconds"
          description: >-
            These paths take row locks. Latency here usually means lock contention or a
            slow database, and it turns into queued requests rather than errors, so it
            will not show up as a failure rate.
