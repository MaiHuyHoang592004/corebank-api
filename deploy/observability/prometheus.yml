global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The application's own Prometheus endpoint.
  #
  # It sits behind authentication on purpose. Metrics disclose request paths, error
  # rates and business volumes, which is not information a banking deployment should
  # serve anonymously, so the scraper carries credentials rather than the endpoint
  # being opened up. In Kubernetes the same endpoint is additionally moved to a
  # container port the Service and Ingress never publish.
  - job_name: corebank-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: demo_ops
      password: demo_ops
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          environment: local

  # Metrics the application pushed over OTLP, re-exposed by the collector. Both paths
  # are wired so the difference between scraping and pushing is visible side by side.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
