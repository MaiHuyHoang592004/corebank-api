# Showcase profile — public demo deployment
# Activated via: SPRING_PROFILES_ACTIVE=showcase

spring:
  autoconfigure:
    # Disable Kafka auto-config in showcase — avoids KafkaAdmin connection attempts
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms

corebank:
  kafka:
    # Disable Kafka in showcase — PostgreSQL outbox rows are still written
    enabled: false
  showcase:
    # Enable token-gate for destructive ops (maintenance, executions, secrets)
    token-gate-enabled: true
    # Token value that unlocks destructive ops for an ADMIN caller sending it in
    # the X-Showcase-Token header. No fallback on purpose: unset means every
    # request to those paths fails closed, never a value anyone can read out of
    # this public repo's source. Set COREBANK_SHOWCASE_TOKEN before relying on it.
    token: ${COREBANK_SHOWCASE_TOKEN:}

management:
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
