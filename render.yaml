# Render Blueprint — CoreBank API
# Deploy via: https://dashboard.render.com/blueprints

services:
  - type: web
    name: corebank-api
    runtime: docker
    plan: free
    repo: https://github.com/MaiHuyHoang592004/corebank-api
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: showcase
      - key: COREBANK_KAFKA_ENABLED
        value: "false"
      # The image sets -XX:MaxRAMPercentage=70 by default, which sizes the heap from
      # whatever memory the plan grants. Override only to add flags.
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: corebank-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: corebank-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: corebank-postgres
          property: password

databases:
  - name: corebank-postgres
    plan: free
    postgresMajorVersion: 16
